plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.nettarion.stride'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    // Every lint category is an error except `exports`: the exported world, block and geometry
    // packages hold mechanism types whose signatures mention the non-exported tick and server
    // packages. Those members are internal; the package documentation names the supported API.
    options.compilerArgs.addAll(['-Xlint:all,-exports', '-Werror'])
}

tasks.named('test', Test) {
    useJUnitPlatform()
    systemProperty 'junit.jupiter.execution.timeout.default', '30s'
    systemProperty 'junit.jupiter.execution.timeout.thread.dump.enabled', 'true'
    testLogging { exceptionFormat = 'full' }
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.docTitle = 'Stride Simulator API'
    options.windowTitle = 'Stride Simulator API'
    options.addBooleanOption('Xdoclint:all,-missing', true)
    options.addStringOption('Xmaxwarns', '10000')
    options.addBooleanOption('Werror', true)
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

publishing {
    publications {
        simulator(MavenPublication) {
            from components.java
            artifactId = 'stride-simulator'
            pom {
                name = 'Stride Simulator'
                description = 'A deterministic Java simulator for an admitted subset of Minecraft player movement.'
                url = 'https://github.com/ball2jh/stride-simulator'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/license/mit'
                    }
                }
                scm {
                    url = 'https://github.com/ball2jh/stride-simulator'
                    connection = 'scm:git:https://github.com/ball2jh/stride-simulator.git'
                }
            }
        }
    }
}

// VoxelShape.collide uses AxisCycle to orient one collision rule. Expand that
// orientation at build time: the upstream project measured a throughput cost for runtime-shared loops. The template is the only maintained collision arithmetic.
def generateShapeCollision = tasks.register('generateShapeCollision') {
	description = 'Expands the collision template into three fixed axis orientations.'
	inputs.file(layout.projectDirectory.file('src/main/templates/ShapeCollision.java.template'))
		.withPathSensitivity(PathSensitivity.RELATIVE)
	outputs.dir(layout.buildDirectory.dir('generated/sources/shapeCollision/java/main'))

	doLast { task ->
		task.outputs.files.singleFile.deleteDir()
		String template = task.inputs.files.singleFile.getText('UTF-8')
		String[] prefixAndLoop = template.split('@BEGIN_AXIS_LOOP@', -1)
		if (prefixAndLoop.length != 2) {
			throw new GradleException('Collision template must have one @BEGIN_AXIS_LOOP@ marker')
		}
		String[] loopAndSuffix = prefixAndLoop[1].split('@END_AXIS_LOOP@', -1)
		if (loopAndSuffix.length != 2) {
			throw new GradleException('Collision template must have one @END_AXIS_LOOP@ marker')
		}
		String methods = [['X', 'Y', 'Z'], ['Y', 'X', 'Z'], ['Z', 'X', 'Y']].collect { axes ->
			loopAndSuffix[0].replace('@AXIS@', axes[0])
				.replace('@FIRST@', axes[1]).replace('@SECOND@', axes[2])
		}.join('\n')
		String source = prefixAndLoop[0] + methods + loopAndSuffix[1]
		if (source =~ /@[A-Z_]+@/) {
			throw new GradleException('Collision template contains an unexpanded marker')
		}
		File output = new File(task.outputs.files.singleFile,
			'com/nettarion/stride/simulator/geometry/ShapeCollision.java')
		output.parentFile.mkdirs()
		output.setText(source, 'UTF-8')
	}
}

sourceSets.main.java.srcDir(generateShapeCollision)

// One declared field table expands into the copy, equality, digest and wire
// plumbing of the three player copies, so adding a field is one row and one
// declaration. StateEncodingStabilityTest holds the expansion to the recorded bits.
def generateStateFields = tasks.register('generateStateFields', Exec) {
	description = 'Expands the state field table into StateFields.java.'
	def table = layout.projectDirectory.file('src/main/fields/state-fields.tsv')
	def script = layout.projectDirectory.file('src/main/fields/generate.py')
	def output = layout.buildDirectory.dir('generated/sources/stateFields/java/main')
	inputs.file(table).withPathSensitivity(PathSensitivity.RELATIVE)
	inputs.file(script).withPathSensitivity(PathSensitivity.RELATIVE)
	outputs.dir(output)
	commandLine providers.gradleProperty('pythonExecutable').getOrElse('python3'), script.asFile.path, table.asFile.path, output.get().asFile.path
}

sourceSets.main.java.srcDir(generateStateFields)

sourceSets {
    examples {
        java.srcDir 'examples/src/main/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

def example = tasks.register('runExample', JavaExec) {
    group = 'application'
    description = 'Runs the standalone world, stepping, and scheduled-fork example.'
    dependsOn tasks.named('examplesClasses')
    classpath = sourceSets.examples.runtimeClasspath
    mainClass = 'com.nettarion.stride.examples.GettingStarted'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}

def apiDocs = tasks.register('checkApiDocs', Exec) {
    group = 'verification'
    description = 'Checks that every public declared type and source package has documentation.'
    def launcher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    commandLine launcher.get().executablePath.asFile, 'tools/CheckApiDocs.java', 'src/main/java'
}

def fixtures = tasks.register('verifyFixtures', Exec) {
    group = 'verification'
    description = 'Verifies the bundled observation fixtures against their recorded hashes.'
    commandLine providers.gradleProperty('pythonExecutable').getOrElse('python3'), 'tools/verify-fixtures.py'
}

tasks.named('check') {
    dependsOn tasks.named('javadoc'), apiDocs, fixtures, example
}

tasks.named('sourcesJar') {
    from('src/main/templates') { into 'META-INF/generators/templates' }
    from('src/main/fields') { into 'META-INF/generators/fields' }
}

tasks.withType(Jar).configureEach {
    from('LICENSE') { into 'META-INF' }
    from('THIRD_PARTY_NOTICES.md') { into 'META-INF' }
}
